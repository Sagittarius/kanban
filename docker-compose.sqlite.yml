services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban
    ports:
      - "3000:3000"
    environment:
      KANBAN_DB_DRIVER: sqlite
      KANBAN_SQLITE_PATH: /data/kanban.sqlite
      KANBAN_SQLITE_BACKUP_DIR: /data/backups
      KANBAN_LOG_DIR: /data/logs
      KANBAN_AUTO_UPGRADE: "true"
      KANBAN_IMAGE_TAG: kanban:sqlite-{version}
      KANBAN_LOG_CONSOLE: ${KANBAN_LOG_CONSOLE:-true}
      KANBAN_LOG_FILE_ENABLED: ${KANBAN_LOG_FILE_ENABLED:-true}
      KANBAN_LOG_MAX_SIZE_MB: ${KANBAN_LOG_MAX_SIZE_MB:-50}
      KANBAN_LOG_MAX_FILES: ${KANBAN_LOG_MAX_FILES:-10}
      KANBAN_LOG_RETENTION_DAYS: ${KANBAN_LOG_RETENTION_DAYS:-30}
    volumes:
      - kanban-data:/data
    restart: unless-stopped

volumes:
  kanban-data:
