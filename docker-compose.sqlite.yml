services:
  kanban:
    build: .
    image: private-kanban:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      KANBAN_DB_DRIVER: sqlite
      KANBAN_SQLITE_PATH: /data/kanban.sqlite
      KANBAN_AUTH_SECRET: ${KANBAN_AUTH_SECRET:?必须设置 KANBAN_AUTH_SECRET，例如 export KANBAN_AUTH_SECRET=$(openssl rand -hex 32)}
      KANBAN_SUPER_ADMIN_USERNAME: ${KANBAN_SUPER_ADMIN_USERNAME:-admin}
      KANBAN_SUPER_ADMIN_PASSWORD: ${KANBAN_SUPER_ADMIN_PASSWORD:?必须设置 KANBAN_SUPER_ADMIN_PASSWORD，例如 export KANBAN_SUPER_ADMIN_PASSWORD=your-secure-password}
      KANBAN_DEFAULT_TIMEZONE: Asia/Shanghai
    volumes:
      - kanban_sqlite:/data

volumes:
  kanban_sqlite:
