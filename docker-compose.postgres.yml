services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban_password
    volumes:
      - kanban_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 10s
      timeout: 5s
      retries: 5

  kanban:
    build: .
    image: private-kanban:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      KANBAN_DB_DRIVER: postgres
      POSTGRES_URL: postgres://kanban:kanban_password@postgres:5432/kanban
      KANBAN_AUTH_SECRET: change-this-to-a-long-random-secret
      KANBAN_SUPER_ADMIN_USERNAME: admin
      KANBAN_SUPER_ADMIN_PASSWORD: admin@123
      KANBAN_DEFAULT_TIMEZONE: Asia/Shanghai

volumes:
  kanban_postgres:
