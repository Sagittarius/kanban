services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD，例如 export POSTGRES_PASSWORD=$(openssl rand -hex 16)}
    volumes:
      - kanban_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 10s
      timeout: 5s
      retries: 5

  kanban:
    build: .
    image: private-kanban:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      KANBAN_DB_DRIVER: postgres
      POSTGRES_URL: postgres://kanban:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}@postgres:5432/kanban
      KANBAN_AUTH_SECRET: ${KANBAN_AUTH_SECRET:?必须设置 KANBAN_AUTH_SECRET，例如 export KANBAN_AUTH_SECRET=$(openssl rand -hex 32)}
      KANBAN_SUPER_ADMIN_USERNAME: ${KANBAN_SUPER_ADMIN_USERNAME:-admin}
      KANBAN_SUPER_ADMIN_PASSWORD: ${KANBAN_SUPER_ADMIN_PASSWORD:?必须设置 KANBAN_SUPER_ADMIN_PASSWORD，例如 export KANBAN_SUPER_ADMIN_PASSWORD=your-secure-password}
      KANBAN_DEFAULT_TIMEZONE: Asia/Shanghai

volumes:
  kanban_postgres:
