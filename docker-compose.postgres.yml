services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban_password}
      POSTGRES_DB: kanban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kanban:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - KANBAN_DB_DRIVER=postgres
      - POSTGRES_URL=postgres://kanban:${POSTGRES_PASSWORD:-kanban_password}@postgres:5432/kanban
      - KANBAN_AUTH_SECRET=${KANBAN_AUTH_SECRET:-change-this-to-a-long-random-secret}
      - KANBAN_SUPER_ADMIN_USERNAME=${KANBAN_SUPER_ADMIN_USERNAME:-admin}
      - KANBAN_SUPER_ADMIN_PASSWORD=${KANBAN_SUPER_ADMIN_PASSWORD:-admin@123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
